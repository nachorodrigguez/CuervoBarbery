<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Cuervo Barbery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <!-- SDK Mercado Pago -->
    <script src="https://sdk.mercadopago.com/js/v2"></script>
</head>
<body class="checkout-page">
    <header class="navbar scrolled">
        <div class="container nav-container">
            <a href="index.html" class="logo">Cuervo <span>Barbery</span></a>
            <a href="index.html" class="back-link">← Volver a la Tienda</a>
        </div>
    </header>

    <main class="checkout-container container">
        <h1 class="checkout-title">Finalizar Compra</h1>

        <div class="checkout-grid">
            <!-- Formulario de Datos -->
            <div class="checkout-form-section">
                <h2>1. Datos de Envío y Contacto</h2>
                <form id="checkout-form" class="contact-form">
                    <div class="form-group">
                        <input type="text" id="name" placeholder="Nombre completo" required>
                    </div>
                    <div class="form-group">
                        <input type="email" id="email" placeholder="Correo electrónico" required>
                    </div>
                    <div class="form-group">
                        <input type="tel" id="phone" placeholder="Teléfono" required>
                    </div>
                    <div class="form-group">
                        <input type="text" id="address" placeholder="Dirección de envío completa" required>
                    </div>
                </form>

                <h2 class="mt-4">2. Método de Pago</h2>
                <div class="payment-methods">
                    <div class="payment-option">
                        <input type="radio" name="payment" id="mp-cards" checked>
                        <label for="mp-cards">
                            <strong>Mercado Pago</strong>
                            <span>Tarjetas de Crédito, Débito, Efectivo y Transferencia</span>
                            <div class="card-icons">
                                <img src="https://logospng.org/download/visa/logo-visa-2048.png" alt="Visa" width="40">
                                <img src="https://logospng.org/download/mastercard/logo-mastercard-2048.png" alt="Mastercard" width="40">
                            </div>
                        </label>
                    </div>
                </div>

                <div class="security-badges">
                    <div class="badge">
                        <span>🔒</span> Sitio Seguro
                    </div>
                    <div class="badge">
                        <span>🛡️</span> SSL Encrypted
                    </div>
                </div>

                <div id="wallet_container" class="mt-4">
                    <!-- Mercado Pago Bricks/Button will be injected here -->
                    <button id="mock-pay-btn" class="btn btn-primary" style="width: 100%; display: none;">Pagar con Mercado Pago (Mock)</button>
                </div>
            </div>

            <!-- Resumen del Pedido -->
            <div class="order-summary-section">
                <h2>Resumen del Pedido</h2>
                <div id="order-items" class="order-items">
                    <!-- Cargado via JS -->
                </div>
                <div class="order-total">
                    <div class="total-row">
                        <span>Subtotal</span>
                        <span id="subtotal-amount">$0.00</span>
                    </div>
                    <div class="total-row">
                        <span>Envío</span>
                        <span>Gratis</span>
                    </div>
                    <div class="total-row final-total">
                        <span>Total</span>
                        <span id="total-amount">$0.00</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 Cuervo Barbery. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="js/checkout.js"></script>
</body>
</html>
